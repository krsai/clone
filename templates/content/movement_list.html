<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Movements</title>
</head>
<body>
<h1>Movement History</h1>
<a href="{% url 'movement_add' %}">Record Movement</a> |
<a href="{% url 'material_list' %}">Back to Materials</a>
<table border="1">
    <tr>
        <th>Time</th>
        <th>Material</th>
        <th>Type</th>
        <th>Quantity</th>
    </tr>
    {% for move in movements %}
    <tr>
        <td>{{ move.timestamp }}</td>
        <td>{{ move.material.name }}</td>
        <td>{{ move.get_movement_type_display }}</td>
        <td>{{ move.quantity }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No movements found.</td></tr>
    {% endfor %}
</table>
</body>
</html>
