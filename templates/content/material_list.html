<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Materials</title>
</head>
<body>
<h1>Material Stock</h1>
<a href="{% url 'material_add' %}">Add Material</a> |
<a href="{% url 'movement_add' %}">Record Movement</a> |
<a href="{% url 'movement_list' %}">View Movements</a>
<table border="1">
    <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Stock</th>
    </tr>
    {% for material in materials %}
    <tr>
        <td>{{ material.name }}</td>
        <td>{{ material.description }}</td>
        <td>{{ material.stock }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No materials found.</td></tr>
    {% endfor %}
</table>
</body>
</html>
